name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@v1
    secrets: inherit
    with:
      spec-name: dials
      copr-project: dials
      # Slint's skia renderer downloads prebuilt Skia at build time.
      copr-enable-net: true
