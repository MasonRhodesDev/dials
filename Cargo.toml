[package]
name = "hyprstate-gui"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Displays configurator for hyprstate — edit shared monitor-profiles TOML"
repository = "https://github.com/MasonRhodesDev/hyprstate-gui"
publish = false

[dependencies]
monitor-profiles = { git = "https://github.com/MasonRhodesDev/monitor-profiles", rev = "aef5f0e" }
hypr-paths = { git = "https://github.com/MasonRhodesDev/hypr-paths", rev = "1f94b71311a989bff5f7ae9b0ef2afd23ee14b16" }
# Git pins (not path) so RPM/PKGBUILD can vendor from a git-archive tarball.
hyprstate-fsm = { git = "https://github.com/MasonRhodesDev/hyprstate", rev = "38172c2797ac905dfcd04bf5e58b485644d10a2c" }
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia",
    "accessibility",
    "compat-1-2",
] }
slint-kit = { git = "https://github.com/MasonRhodesDev/slint-kit", rev = "464de0e4d5fc61516960ac0d25292d9cc2781ef5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.17"
slint-kit = { git = "https://github.com/MasonRhodesDev/slint-kit", rev = "464de0e4d5fc61516960ac0d25292d9cc2781ef5" }
