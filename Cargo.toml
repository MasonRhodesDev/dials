[package]
name = "dials"
version = "0.4.2"
edition = "2024"
license = "MIT"
description = "Desktop settings for Wayland sessions: displays, power, and a hub for other settings tools"
repository = "https://github.com/MasonRhodesDev/dials"
publish = false

[dependencies]
monitor-profiles = { git = "https://github.com/MasonRhodesDev/monitor-profiles", rev = "aef5f0e" }
xdg-paths = "0.2.0"
# Git pins (not path) so RPM/PKGBUILD can vendor from a git-archive tarball.
hyprstate-fsm = { git = "https://github.com/MasonRhodesDev/hyprstate", rev = "38172c2797ac905dfcd04bf5e58b485644d10a2c" }
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia",
    "accessibility",
    "compat-1-2",
] }
slint-kit = { git = "https://github.com/MasonRhodesDev/slint-kit", rev = "ccd7397c3da83ff835d6295d6ec3841fc32c8bac" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "=1.17.1"
slint-kit = { git = "https://github.com/MasonRhodesDev/slint-kit", rev = "ccd7397c3da83ff835d6295d6ec3841fc32c8bac" }
