[package]
name = "dials"
version = "0.4.4"
edition = "2024"
license = "MIT"
description = "Desktop settings for Wayland sessions: displays, power, and a hub for other settings tools"
repository = "https://github.com/MasonRhodesDev/dials"
publish = false

[dependencies]
monitor-profiles = { git = "https://github.com/MasonRhodesDev/monitor-profiles", rev = "64d5d1e" }
xdg-paths = "0.2.0"
# Git pins (not path) so RPM/PKGBUILD can vendor from a git-archive tarball.
hyprstate-fsm = { git = "https://github.com/MasonRhodesDev/hyprstate", rev = "746bbd2608f19e7e9ac5113131710f54f6c98f9e" }
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia",
    "accessibility",
    "compat-1-2",
] }
slint-kit = { git = "https://github.com/MasonRhodesDev/slint-kit", rev = "ccd7397c3da83ff835d6295d6ec3841fc32c8bac" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same source string lmtt-core pins (short rev, .git suffix): one compiled copy, and the
# offline COPR source mapping in packaging/dials.spec already covers it.
appearance-profiles = { git = "https://github.com/MasonRhodesDev/appearance-profiles.git", rev = "75d831a" }
# Preview thumbnails (decoded off the UI thread). Unifies with the image crate Slint already links.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# XDG desktop portal file chooser (org.freedesktop.portal.FileChooser) on the zbus 5 already in the tree.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser"] }
async-io = "2"
url = "2"

[build-dependencies]
slint-build = "=1.17.1"
slint-kit = { git = "https://github.com/MasonRhodesDev/slint-kit", rev = "ccd7397c3da83ff835d6295d6ec3841fc32c8bac" }
