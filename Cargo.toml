[package]
name = "dials"
version = "0.4.7"
edition = "2024"
license = "MIT"
description = "Desktop settings for Wayland sessions: displays, power, users, system, and a hub for other settings tools"
repository = "https://github.com/MasonRhodesDev/dials"
publish = false

[dependencies]
monitor-profiles = { git = "https://github.com/MasonRhodesDev/monitor-profiles", rev = "64d5d1e", optional = true }
xdg-paths = "0.2.0"
# Git pins (not path) so RPM/PKGBUILD can vendor from a git-archive tarball.
hyprstate-fsm = { git = "https://github.com/MasonRhodesDev/hyprstate", rev = "746bbd2608f19e7e9ac5113131710f54f6c98f9e", optional = true }
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia",
    "accessibility",
    "compat-1-2",
] }
slint-kit = { git = "https://github.com/MasonRhodesDev/slint-kit", rev = "3581f653546ae1e187bc3f2bb20c54019d0a202a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same source string lmtt-core pins (short rev, .git suffix): one compiled copy, and the
# offline COPR source mapping in packaging/dials.spec already covers it.
appearance-profiles = { git = "https://github.com/MasonRhodesDev/appearance-profiles.git", rev = "75d831a", optional = true }
# Preview thumbnails (decoded off the UI thread). Unifies with the image crate Slint already links.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
# XDG desktop portal file chooser (org.freedesktop.portal.FileChooser) on the zbus 5 already in the tree.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser"], optional = true }
async-io = { version = "2", optional = true }
url = { version = "2", optional = true }
# Appearance page: lmtt's own option detectors (same rev slint-kit pins) and
# comment-preserving edits of ~/.config/lmtt/config.toml.
lmtt-core = { git = "https://github.com/MasonRhodesDev/linux-multi-theme-toggle", rev = "344529cd124c131da40409b152bc1604eebd53d0", optional = true }
toml_edit = { version = "0.25", optional = true }
# Users and System: AccountsService, systemd and login1 on the system bus.
# Blocking only: dials has no async runtime. 5.x unifies with accesskit's copy.
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"], optional = true }
libc = { version = "0.2", optional = true }

[features]
# Each core-family integration is a page module behind a feature (src/pages).
# A build without one drops that page and its crates; More always remains.
default = ["displays", "power", "help", "wallpaper", "appearance", "users", "system"]
# hyprstate daemon surface: telemetry client and policy types.
hyprstate = ["dep:hyprstate-fsm"]
# Displays: monitor-profiles editor on hyprctl.
displays = ["dep:monitor-profiles"]
# Power: policy map, sensors, overrides.
power = ["hyprstate"]
# Help: live graphs from telemetry plus the Displays and Power data.
help = ["hyprstate", "displays", "power"]
# Wallpaper: per-display backgrounds in Displays, through lmtt and the
# appearance-profiles registry, picked with the XDG portal.
wallpaper = ["displays", "dep:appearance-profiles", "dep:image", "dep:ashpd", "dep:async-io", "dep:url"]
# Appearance: lmtt's settings, rendered from its config schema.
appearance = ["dep:lmtt-core", "dep:toml_edit"]
# Privileged-write worker shared by Users and System: one thread on the system
# bus, so polkit prompts never block the UI.
admin = ["dep:zbus", "dep:libc"]
# Users: accounts through AccountsService, groups through pkexec, passwords
# (libxcrypt hashes; passwd on a pty for self-change).
users = ["admin"]
# System: hostname, time zone, NTP, language and keyboard through systemd.
system = ["admin"]

[build-dependencies]
slint-build = "=1.17.1"
slint-kit = { git = "https://github.com/MasonRhodesDev/slint-kit", rev = "3581f653546ae1e187bc3f2bb20c54019d0a202a" }
