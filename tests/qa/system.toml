# System page write paths in a hypr-qa guest (plain-hyprland: polkit-gnome,
# user qa/qa in wheel): hostname, device name, time zone, NTP, language and
# keyboard layout through hostnamed, timedated and localed. The setup rule makes
# each action ask, so each write is followed by a prompt step that fails when no
# dialog opened, the answer, and a check against hostnamectl/timedatectl/localectl.
#
#   tests/qa/run system.toml
#
# Coordinates are guest pixels at 1280x800 with dials tiled full screen.

name     = "dials-system"
profile  = "plain-hyprland"
snapshot = "session-ready"
stop_on_fail = true

[[setup]]
push = { src = "dials", dst = "/tmp/dials", mode = "0755" }

[[setup]]
session = "sudo install -m 755 /tmp/dials /usr/local/bin/dials"

[[setup]]  # every action prompts, so the steps below don't depend on polkit's 5-minute keep
session = '''echo 'polkit.addRule(function (a, s) { if (/^org\.freedesktop\.(hostname1|timedate1|locale1)\./.test(a.id)) return polkit.Result.AUTH_ADMIN; });' | sudo tee /etc/polkit-1/rules.d/10-dials-qa.rules >/dev/null'''

[[setup]]  # a second language to pick, and an xkb option the layout change must keep
session = '''echo 'de_DE.UTF-8 UTF-8' | sudo tee -a /etc/locale.gen >/dev/null && sudo locale-gen >/dev/null && sudo localectl set-x11-keymap us pc105 '' terminate:ctrl_alt_bksp && sudo timedatectl set-timezone UTC'''

[[setup]]
session = '''hyprctl dispatch 'hl.dsp.exec_cmd("dials")' && for i in $(seq 60); do hyprctl clients | grep -q 'title: Dials' && sleep 4 && exit 0; sleep 1; done; exit 1'''

# The window opened under a still pointer: move once so dials gets pointer focus.
[[step]]
id = "pointer-in"
do = { vmkit = ["move", "600", "300"] }
settle_ms = 300

[[step]]
id = "open-system"
do = { vmkit = ["tap", "447", "56"] }
settle_ms = 2500

  [[step.expect]]
  at = "+1500ms..+2500ms"
  check = "ocr"
  region = [22, 120, 900, 40]
  text = "Machine-wide settings"

  [[step.expect]]          # reads the guest's current values
  at = "+1500ms..+2500ms"
  check = "ocr"
  region = [22, 440, 600, 40]
  regex = "Time zone\\W+UTC"   # tesseract reads the middle dot loosely

# ---- names -------------------------------------------------------------------

[[step]]
id = "focus-hostname"
do = { vmkit = ["tap", "600", "230"] }
settle_ms = 600

[[step]]
id = "select-hostname"
do = { vmkit = ["keys", "ctrl", "a"] }
settle_ms = 400

[[step]]
id = "type-hostname"
do = { vmkit = ["type", "dials-qa"] }
settle_ms = 1000

[[step]]
id = "apply-hostname"
do = { vmkit = ["tap", "1209", "230"] }

[[step]]
id = "hostname-prompt"
do = { session = "for i in $(seq 40); do hyprctl clients | grep -q 'title: Authenticate' && exit 0; sleep 0.25; done; exit 1" }
settle_ms = 500

  [[step.expect]]
  at = "+0ms..+400ms"
  anchor = "ack"
  check = "ocr"
  text = "Authentication is required"

[[step]]
id = "hostname-answer"
do = { vmkit = ["type", "qa\n"] }
settle_ms = 3000

[[step]]
id = "hostname-set"
do = { session = "test \"$(hostnamectl --static)\" = dials-qa" }

[[step]]
id = "focus-device-name"
do = { vmkit = ["tap", "600", "310"] }
settle_ms = 600

[[step]]
id = "type-device-name"
do = { vmkit = ["type", "Dials QA"] }
settle_ms = 1000

[[step]]
id = "apply-device-name"
do = { vmkit = ["tap", "1209", "310"] }

[[step]]
id = "device-name-prompt"
do = { session = "for i in $(seq 40); do hyprctl clients | grep -q 'title: Authenticate' && exit 0; sleep 0.25; done; exit 1" }
settle_ms = 500

[[step]]
id = "device-name-answer"
do = { vmkit = ["type", "qa\n"] }
settle_ms = 3000

[[step]]
id = "device-name-set"
do = { session = "test \"$(hostnamectl --pretty)\" = 'Dials QA'" }

# ---- time --------------------------------------------------------------------

[[step]]
id = "focus-time-zone"
do = { vmkit = ["tap", "600", "493"] }
settle_ms = 600

[[step]]
id = "search-time-zone"
do = { vmkit = ["type", "Chicago"] }
settle_ms = 1500

  [[step.expect]]
  at = "+1000ms..+1500ms"
  anchor = "ack"
  check = "ocr"
  region = [22, 510, 600, 60]
  text = "America/Chicago"

[[step]]
id = "pick-time-zone"      # Enter picks the first match
do = { vmkit = ["keys", "ret"] }

[[step]]
id = "time-zone-prompt"
do = { session = "for i in $(seq 40); do hyprctl clients | grep -q 'title: Authenticate' && exit 0; sleep 0.25; done; exit 1" }
settle_ms = 500

[[step]]
id = "time-zone-answer"
do = { vmkit = ["type", "qa\n"] }
settle_ms = 3000

[[step]]
id = "time-zone-set"
do = { session = "test \"$(timedatectl show -p Timezone --value)\" = America/Chicago" }

  [[step.expect]]
  at = "+0ms"
  check = "ocr"
  region = [22, 450, 600, 30]
  text = "America/Chicago"

[[step]]
id = "ntp-off"
do = { vmkit = ["tap", "47", "408"] }

[[step]]
id = "ntp-off-prompt"
do = { session = "for i in $(seq 40); do hyprctl clients | grep -q 'title: Authenticate' && exit 0; sleep 0.25; done; exit 1" }
settle_ms = 500

[[step]]
id = "ntp-off-answer"
do = { vmkit = ["type", "qa\n"] }
settle_ms = 3000

[[step]]
id = "ntp-is-off"
do = { session = "test \"$(timedatectl show -p NTP --value)\" = no" }

[[step]]
id = "ntp-on"
do = { vmkit = ["tap", "47", "408"] }

[[step]]
id = "ntp-on-prompt"
do = { session = "for i in $(seq 40); do hyprctl clients | grep -q 'title: Authenticate' && exit 0; sleep 0.25; done; exit 1" }
settle_ms = 500

[[step]]
id = "ntp-on-answer"
do = { vmkit = ["type", "qa\n"] }
settle_ms = 3000

[[step]]
id = "ntp-is-on"
do = { session = "test \"$(timedatectl show -p NTP --value)\" = yes" }

# ---- language and keyboard -------------------------------------------------------

[[step]]
id = "focus-language"
do = { vmkit = ["tap", "600", "593"] }
settle_ms = 600

[[step]]
id = "search-language"
do = { vmkit = ["type", "de_DE"] }
settle_ms = 1500

[[step]]
id = "pick-language"
do = { vmkit = ["keys", "ret"] }

[[step]]
id = "language-prompt"
do = { session = "for i in $(seq 40); do hyprctl clients | grep -q 'title: Authenticate' && exit 0; sleep 0.25; done; exit 1" }
settle_ms = 500

[[step]]
id = "language-answer"
do = { vmkit = ["type", "qa\n"] }
settle_ms = 3000

[[step]]
id = "language-set"
do = { session = "localectl status | grep -q 'LANG=de_DE.UTF-8'" }

[[step]]
id = "focus-layout"
do = { vmkit = ["tap", "600", "655"] }
settle_ms = 600

[[step]]
id = "search-layout"
do = { vmkit = ["type", "de"] }
settle_ms = 1500

[[step]]
id = "pick-layout"
do = { vmkit = ["keys", "ret"] }

[[step]]
id = "layout-prompt"
do = { session = "for i in $(seq 40); do hyprctl clients | grep -q 'title: Authenticate' && exit 0; sleep 0.25; done; exit 1" }
settle_ms = 500

[[step]]
id = "layout-answer"
do = { vmkit = ["type", "qa\n"] }
settle_ms = 3000

[[step]]
id = "layout-set"          # the layout changed; model and options survived it
do = { session = "s=$(localectl status) && echo \"$s\" | grep -q 'X11 Layout: de$' && echo \"$s\" | grep -q 'X11 Model: pc105$' && echo \"$s\" | grep -q 'X11 Options: terminate:ctrl_alt_bksp$' && ! hyprctl clients | grep -q 'title: Authenticate'" }
